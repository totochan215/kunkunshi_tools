name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Lancer les tests
        run: python3 tests/run_tests.py
      - name: Lancer les tests kkml2pdf
        run: python3 tests/test_kkml2pdf.py
      - name: Lancer les tests yubii
        run: python3 tests/test_yubii.py
      - name: Lancer les tests portama_meta
        run: python3 tests/test_portama_meta.py
      - name: Lancer les tests testbushi
        run: python3 tests/test_testbushi.py
      - name: Lancer les tests d'échappement ruby
        run: python3 tests/test_escape.py
      - name: Lancer les tests @source et liens
        run: python3 tests/test_source.py
      - name: Lancer les tests d'ordre des métadonnées du cleaner
        run: python3 tests/test_cleaner_meta.py
      - name: Lancer les tests des marqueurs de couplet ①-⑳
        run: python3 tests/test_verse_markers.py
      - name: Lancer les tests de ::song (nom de chanson ; ::section = alias)
        run: python3 tests/test_song.py
      - name: Lancer les tests mega (@mega_dans, ::block/::page)
        run: python3 tests/test_mega_breaks.py
      - name: Lancer les tests du straddle de tête /B (rang -1)
        run: python3 tests/test_lead_straddle.py
      - name: Lancer les tests des groupes SVG de répétition
        run: python3 tests/test_svg_groups.py
      - name: Lancer les tests des attributs de design (@text_color, @frame_*, @cell_*, @arrow_*)
        run: python3 tests/test_layout_attrs.py
