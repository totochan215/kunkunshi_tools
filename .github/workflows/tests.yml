name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Lancer les tests
        run: python3 tests/run_tests.py
      - name: Lancer les tests kkml2pdf
        run: python3 tests/test_kkml2pdf.py
      - name: Lancer les tests yubii
        run: python3 tests/test_yubii.py
      - name: Lancer les tests portama_meta
        run: python3 tests/test_portama_meta.py
      - name: Lancer les tests testbushi
        run: python3 tests/test_testbushi.py
      - name: Lancer les tests d'échappement ruby
        run: python3 tests/test_escape.py
      - name: Lancer les tests @source et liens
        run: python3 tests/test_source.py
      - name: Lancer les tests d'ordre des métadonnées du cleaner
        run: python3 tests/test_clean_meta.py
      - name: Lancer les tests des marqueurs de couplet ①-⑳
        run: python3 tests/test_verse_markers.py
      - name: Lancer les tests de ::song (nom de chanson ; ::section = alias)
        run: python3 tests/test_song.py
      - name: Lancer les tests mega (@mega_dans, ::block/::page)
        run: python3 tests/test_mega_breaks.py
      - name: Lancer les tests du straddle de tête /B (rang -1)
        run: python3 tests/test_lead_straddle.py
      - name: Lancer les tests des groupes SVG de répétition
        run: python3 tests/test_svg_groups.py
      - name: Lancer les tests des attributs de design (@text_color, @frame_*, @cell_*, @arrow_*)
        run: python3 tests/test_layout_attrs.py
      - name: Lancer les tests du cleaner sur medley (pas de vrac par ::song)
        run: python3 tests/test_clean_medley.py
      - name: Lancer les tests complets du cleaner (kkml_clean)
        run: python3 tests/test_kkml_clean.py
      - name: Lancer les tests de kkml_beautify (alignement ::tab/::vocal)
        run: python3 tests/test_beautify.py
      - name: Lancer les tests de @show_dots (points ・ des ::vocal)
        run: python3 tests/test_show_dots.py
      - name: Lancer les tests \\ー échappé et koedashi/koekiri ○/□ dans la case
        run: python3 tests/test_vocal_choonpu_koe.py
      - name: Lancer les tests de numéros de page (@page_base)
        run: python3 tests/test_page_numbers.py
      - name: Lancer les tests d'alignement bas du @choshi (mega/nomura)
        run: python3 tests/test_choshi_align.py
      - name: Lancer les tests du tempo @speed en ♩=120 (6 layouts)
        run: python3 tests/test_speed.py
      - name: Lancer les tests d'alignement des bornes ◯/□ (tiers inférieur de case en horizontal)
        run: python3 tests/test_koe_lower_third.py
      - name: Lancer les tests de la constante md_spacing (espacement homogène des métadonnées)
        run: python3 tests/test_md_spacing.py
