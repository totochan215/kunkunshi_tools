name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Lancer les tests
        run: python3 tests/run_tests.py
      - name: Lancer les tests kkml2pdf
        run: python3 tests/test_kkml2pdf.py
      - name: Lancer les tests yubii
        run: python3 tests/test_yubii.py
      - name: Lancer les tests portama_meta
        run: python3 tests/test_portama_meta.py
      - name: Lancer les tests testbushi
        run: python3 tests/test_testbushi.py
      - name: Lancer les tests d'échappement ruby
        run: python3 tests/test_escape.py
      - name: Lancer les tests @source et liens
        run: python3 tests/test_source.py
